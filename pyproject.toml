[project]
name = "crypto-quant-platform-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "crypto-quant-backtest==0.1.0",
  "crypto-quant-bundle-builder==0.1.0",
  "crypto-quant-domain==0.1.0",
  "crypto-quant-foundation==0.1.0",
  "crypto-quant-market-data==0.1.0",
  "crypto-quant-promotion==0.1.0",
  "crypto-quant-research==0.1.0",
  "crypto-quant-trading==0.1.0",
  "crypto-quant-validation==0.1.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.uv.workspace]
members = [
  "foundation",
  "promotion-gate",
  "research-platform",
  "strategy-validation",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
  "foundation/tests",
  "research-platform/tests",
  "strategy-validation/tests",
  "promotion-gate/tests",
  "tests/architecture",
  "tests/integration",
]

[tool.uv.sources]
crypto-quant-backtest = { git = "https://github.com/YungeG/quant-backtest.git", rev = "d6299927f39d7a3f1f345b4f3122fa3c7522f0b9", subdirectory = "packages/backtest-runtime" }
crypto-quant-bundle-builder = { git = "https://github.com/YungeG/quant-backtest.git", rev = "d6299927f39d7a3f1f345b4f3122fa3c7522f0b9", subdirectory = "packages/market-bundle-builder" }
crypto-quant-domain = { git = "https://github.com/YungeG/quant-backtest.git", rev = "d6299927f39d7a3f1f345b4f3122fa3c7522f0b9", subdirectory = "packages/trading-domain" }
crypto-quant-foundation = { workspace = true }
crypto-quant-market-data = { git = "https://github.com/YungeG/quant-backtest.git", rev = "d6299927f39d7a3f1f345b4f3122fa3c7522f0b9", subdirectory = "packages/market-data-contracts" }
crypto-quant-promotion = { workspace = true }
crypto-quant-research = { workspace = true }
crypto-quant-trading = { git = "https://github.com/YungeG/quant-backtest.git", rev = "d6299927f39d7a3f1f345b4f3122fa3c7522f0b9", subdirectory = "packages/trading-kernel" }
crypto-quant-validation = { workspace = true }
