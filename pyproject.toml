[project]
name = "crypto-quant-platform-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "crypto-quant-backtest==0.1.0",
  "crypto-quant-bundle-builder==0.1.0",
  "crypto-quant-domain==0.1.0",
  "crypto-quant-foundation==0.1.0",
  "crypto-quant-market-data==0.1.0",
  "crypto-quant-promotion==0.1.0",
  "crypto-quant-research==0.1.0",
  "crypto-quant-trading==0.1.0",
  "crypto-quant-validation==0.1.0",
]

[dependency-groups]
# The offline-pc profile qualifies this complete declared test dependency closure.
dev = [
  "pytest==8.4.2",
  "packaging==26.3",
  "pandas==3.0.6",
  "numpy==2.5.3",
  "iniconfig==2.3.0",
  "pluggy==1.6.0",
  "pygments==2.20.0",
  "python-dateutil==2.9.0.post0",
  "six==1.17.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.uv.workspace]
members = [
  "foundation",
  "promotion-gate",
  "research-platform",
  "strategy-validation",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
  "foundation/tests",
  "research-platform/tests",
  "strategy-validation/tests",
  "promotion-gate/tests",
  "tests/architecture",
  "tests/integration",
  "tests/validation",
]

[tool.uv.sources]
crypto-quant-backtest = { git = "https://github.com/YungeG/quant-backtest.git", rev = "ea957d59527e93765681d85c7a2f3fd83e6356a0", subdirectory = "packages/backtest-runtime" }
crypto-quant-bundle-builder = { git = "https://github.com/YungeG/quant-backtest.git", rev = "ea957d59527e93765681d85c7a2f3fd83e6356a0", subdirectory = "packages/market-bundle-builder" }
crypto-quant-domain = { git = "https://github.com/YungeG/quant-backtest.git", rev = "ea957d59527e93765681d85c7a2f3fd83e6356a0", subdirectory = "packages/trading-domain" }
crypto-quant-foundation = { workspace = true }
crypto-quant-market-data = { git = "https://github.com/YungeG/quant-backtest.git", rev = "ea957d59527e93765681d85c7a2f3fd83e6356a0", subdirectory = "packages/market-data-contracts" }
crypto-quant-promotion = { workspace = true }
crypto-quant-research = { workspace = true }
crypto-quant-trading = { git = "https://github.com/YungeG/quant-backtest.git", rev = "ea957d59527e93765681d85c7a2f3fd83e6356a0", subdirectory = "packages/trading-kernel" }
crypto-quant-validation = { workspace = true }
